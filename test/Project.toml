[sources]
# Without this the test environment resolves the REGISTERED PowerSystemsInvestments-
# Portfolios instead of the working tree, so local changes are never exercised and the
# registered package's own compat bounds drive resolution.
PowerSystemsInvestmentsPortfolios = {path = ".."}
InfrastructureSystems = {path = "../../InfrastructureSystems.jl"}
PowerSystems = {path = "../../PowerSystems.jl"}
# Sibling paths, not revs: the OpenAPI packages must be the ones regenerated for
# OpenAPI.jl 1.x, and the remote revs still carry the pre-1.0 output whose compat pins
# OpenAPI to 0.2. A dependency's own [sources] are ignored once it is not the root project,
# so every unregistered package in the graph is pinned here -- PowerOperationsOpenAPIModels
# is unused by PSIP itself and listed only so Pkg can resolve PowerSystems.
PowerCoreOpenAPIModels = {path = "../../PowerOpenAPIModels/PowerCoreOpenAPIModels.jl"}
InfrastructureCoreOpenAPIModels = {path = "../../PowerOpenAPIModels/InfrastructureCoreOpenAPIModels.jl"}
InfrastructureTimeSeriesOpenAPIModels = {path = "../../PowerOpenAPIModels/InfrastructureTimeSeriesOpenAPIModels.jl"}
PowerDynamicsOpenAPIModels = {path = "../../PowerOpenAPIModels/PowerDynamicsOpenAPIModels.jl"}
PowerOpenAPIModels = {path = "../../PowerOpenAPIModels/PowerOpenAPIModels.jl"}
PowerOperationsOpenAPIModels = {path = "../../PowerOpenAPIModels/PowerOperationsOpenAPIModels.jl"}
PowerInvestmentsOpenAPIModels = {path = "../../PowerOpenAPIModels/PowerInvestmentsOpenAPIModels.jl"}
PowerSystemCaseBuilder = {path = "../../PowerSystemCaseBuilder.jl"}
PowerFlowFileParser = {path = "../../PowerFlowFileParser.jl"}
PowerTableDataParser = {path = "../../PowerTableDataParser.jl"}

[compat]
